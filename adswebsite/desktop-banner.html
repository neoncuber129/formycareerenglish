<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FormyCareer Desktop Banner</title>
    <meta name="robots" content="noindex, nofollow" />
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3065045655441784" crossorigin="anonymous"></script>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        background: #0b1220;
        color: #f3f4f6;
      }
      .wrap {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 12px;
      }
      .card {
        width: 100%;
        max-width: 720px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 12px;
        background: linear-gradient(160deg, #111827, #0f172a);
        padding: 16px;
      }
      .top {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .logo {
        width: 28px;
        height: 28px;
        border-radius: 8px;
      }
      .title {
        font-size: 14px;
        font-weight: 700;
        margin: 0;
      }
      .desc {
        margin: 8px 0 12px;
        font-size: 13px;
        line-height: 1.45;
        color: #d1d5db;
      }
      .cta {
        display: inline-block;
        text-decoration: none;
        font-size: 13px;
        font-weight: 700;
        color: #fff;
        background: #2563eb;
        border-radius: 999px;
        padding: 8px 14px;
      }
      .meta {
        margin-top: 10px;
        font-size: 11px;
        color: #9ca3af;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <article class="card" aria-label="FormyCareer desktop banner">
        <div class="top">
          <img class="logo" src="/app-logo.png" alt="" />
          <p class="title">FormyCareer</p>
        </div>
        <p class="desc">
          Build practical vocabulary for work and interviews with spaced repetition, tags, and fast daily review loops.
        </p>
        <a class="cta" href="https://formycareer.vercel.app/download.html" target="_blank" rel="noopener noreferrer">Open official download page</a>
        <p class="meta">This banner page is lightweight for desktop in-app display.</p>
      </article>
    </div>
  </body>
</html>
