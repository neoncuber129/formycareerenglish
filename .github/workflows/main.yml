name: Build Flutter iOS

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check project
        working-directory: apps/desktop
        run: |
          echo "=== Flutter project ==="
          pwd

          echo "=== Files ==="
          ls -la

          echo "=== iOS ==="
          ls -la ios

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        working-directory: apps/desktop
        run: flutter pub get

      - name: Build iOS
        working-directory: apps/desktop
        run: flutter build ios --release --no-codesign

      - name: Show build output
        working-directory: apps/desktop
        run: |
          echo "=== build/ios ==="
          find build/ios -maxdepth 4 -type f | sort
