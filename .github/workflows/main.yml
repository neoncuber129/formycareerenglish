name: Build Flutter IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find Flutter iOS project
        id: flutter_project
        shell: bash
        run: |
          echo "Searching for Flutter iOS project..."

          PROJECT_DIR=""

          while IFS= read -r pubspec; do
            DIR=$(dirname "$pubspec")

            if [ -d "$DIR/ios" ] && [ -f "$DIR/ios/Podfile" ]; then
              PROJECT_DIR="$DIR"
              break
            fi
          done < <(find . -name "pubspec.yaml" \
            -not -path "*/.dart_tool/*" \
            -not -path "*/build/*")

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Flutter iOS project not found"
            echo ""
            echo "Available pubspec.yaml files:"
            find . -name "pubspec.yaml" \
              -not -path "*/.dart_tool/*" \
              -not -path "*/build/*"
            exit 1
          fi

          echo "Flutter iOS project found at: $PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        working-directory: ${{ steps.flutter_project.outputs.project_dir }}
        run: flutter pub get

      - name: Build IPA
        working-directory: ${{ steps.flutter_project.outputs.project_dir }}
        run: flutter build ipa --release --no-codesign

      - name: Show generated files
        shell: bash
        run: |
          PROJECT_DIR="${{ steps.flutter_project.outputs.project_dir }}"

          echo "Searching generated iOS files..."

          find "$PROJECT_DIR/build/ios" \
            -type f \
            \( -name "*.ipa" -o -name "*.app" \) \
            -print

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: formycareerenglish-ipa
          path: ${{ steps.flutter_project.outputs.project_dir }}/build/ios/ipa/*.ipa
          if-no-files-found: error
